<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10초 타이머</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        
        .base-timer {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .base-timer__svg {
            transform: scaleX(-1);
        }

        .base-timer__circle {
            fill: none;
            stroke: none;
        }

        .base-timer__path-elapsed {
            stroke-width: 7px;
            stroke: #e5e7eb; /* Tailwind gray-200 */
        }

        .base-timer__path-remaining {
            stroke-width: 7px;
            stroke-linecap: round;
            transform-origin: center;
            transform: rotate(90deg);
            transition: stroke-dasharray 1s linear;
            stroke: #3b82f6; /* Tailwind blue-500 */
        }

        .base-timer__path-remaining.red {
            stroke: #ef4444; /* Tailwind red-500 */
        }

        .base-timer__label {
            position: absolute;
            width: 300px;
            height: 300px;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            color: #1f2937; /* Tailwind gray-800 */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl flex flex-col items-center gap-8">
        
        <!-- Timer Display Area -->
        <div class="base-timer" id="app">
            <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <g class="base-timer__circle">
                    <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45"></circle>
                    <path
                        id="base-timer-path-remaining"
                        stroke-dasharray="283"
                        class="base-timer__path-remaining"
                        d="
                            M 50, 50
                            m -45, 0
                            a 45,45 0 1,0 90,0
                            a 45,45 0 1,0 -90,0
                        "
                    ></path>
                </g>
            </svg>
            <span id="base-timer-label" class="base-timer__label">10.0</span>
        </div>

        <div class="flex gap-4">
            <button id="startBtn" class="px-6 py-3 bg-blue-500 text-white rounded-lg font-semibold hover:bg-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                시작
            </button>
            <button id="pauseBtn" class="px-6 py-3 bg-yellow-500 text-white rounded-lg font-semibold hover:bg-yellow-600 transition-colors focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                일시정지
            </button>
            <button id="resetBtn" class="px-6 py-3 bg-gray-500 text-white rounded-lg font-semibold hover:bg-gray-600 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                초기화
            </button>
        </div>
    </div>

    <script>
        const TIME_LIMIT = 10;
        let timePassed = 0;
        let timeLeft = TIME_LIMIT;
        let timerInterval = null;
        let isRunning = false;

        const FULL_DASH_ARRAY = 283; // 2 * pi * r (where r is 45)
        const WARNING_THRESHOLD = 3; // 3초 남았을 때 색상 변경

        // DOM 요소 가져오기
        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resetBtn = document.getElementById("resetBtn");
        const timerLabel = document.getElementById("base-timer-label");
        const timerPath = document.getElementById("base-timer-path-remaining");

        // 시간을 00.0 형식으로 포맷팅
        function formatTime(time) {
            return time.toFixed(1);
        }

        // 원형 진행바 계산
        function calculateTimeFraction() {
            const rawTimeFraction = timeLeft / TIME_LIMIT;
            return rawTimeFraction - (1 / TIME_LIMIT) * (1 - rawTimeFraction);
        }

        function setCircleDasharray() {
            const circleDasharray = `${(
                calculateTimeFraction() * FULL_DASH_ARRAY
            ).toFixed(0)} 283`;
            timerPath.setAttribute("stroke-dasharray", circleDasharray);
        }

        // 남은 시간에 따른 색상 변경
        function setRemainingPathColor(timeLeft) {
            if (timeLeft <= WARNING_THRESHOLD) {
                timerPath.classList.add("red");
            } else {
                timerPath.classList.remove("red");
            }
        }

        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.disabled = true;
            startBtn.classList.add("opacity-50", "cursor-not-allowed");
            pauseBtn.disabled = false;
            pauseBtn.classList.remove("opacity-50", "cursor-not-allowed");

            let startTime = Date.now() - (timePassed * 1000);

            timerInterval = setInterval(() => {
                const now = Date.now();
                timePassed = (now - startTime) / 1000;
                timeLeft = Math.max(0, TIME_LIMIT - timePassed);

                timerLabel.innerHTML = formatTime(timeLeft);
                setCircleDasharray();
                setRemainingPathColor(timeLeft);

                if (timeLeft === 0) {
                    onTimesUp();
                }
            }, 50); // 50ms마다 업데이트하여 부드러운 소수점 및 애니메이션 처리
        }

        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(timerInterval);
            isRunning = false;
            
            startBtn.disabled = false;
            startBtn.classList.remove("opacity-50", "cursor-not-allowed");
            startBtn.innerText = "계속";
            
            pauseBtn.disabled = true;
            pauseBtn.classList.add("opacity-50", "cursor-not-allowed");
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timePassed = 0;
            timeLeft = TIME_LIMIT;
            
            timerLabel.innerHTML = formatTime(TIME_LIMIT);
            timerPath.setAttribute("stroke-dasharray", "283 283");
            timerPath.classList.remove("red");
            
            startBtn.disabled = false;
            startBtn.classList.remove("opacity-50", "cursor-not-allowed");
            startBtn.innerText = "시작";
            
            pauseBtn.disabled = true;
            pauseBtn.classList.add("opacity-50", "cursor-not-allowed");
        }

        function onTimesUp() {
            clearInterval(timerInterval);
            isRunning = false;
            
            startBtn.disabled = false;
            startBtn.classList.remove("opacity-50", "cursor-not-allowed");
            startBtn.innerText = "시작";
            
            pauseBtn.disabled = true;
            pauseBtn.classList.add("opacity-50", "cursor-not-allowed");
            
            // 시간이 다 되었을 때 알림
            setTimeout(() => {
                const messageBox = document.createElement("div");
                messageBox.innerText = "10초가 경과했습니다!";
                messageBox.className = "fixed top-1/4 bg-blue-600 text-white px-6 py-3 rounded-lg shadow-lg font-bold text-lg animate-bounce";
                document.body.appendChild(messageBox);
                
                // 3초 후 메시지 제거
                setTimeout(() => {
                    messageBox.remove();
                    resetTimer(); // 알림 후 자동 초기화
                }, 3000);
            }, 100); // 0이 렌더링 된 직후 알림
        }

        startBtn.addEventListener("click", startTimer);
        pauseBtn.addEventListener("click", pauseTimer);
        resetBtn.addEventListener("click", resetTimer);

    </script>
</body>
</html>
